name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm g++-multilib binutils

    - name: build
      run: make

    - name: verify boot sector signature
      run: |
        test "$(wc -c < boot.bin)" -eq 512
        test "$(xxd -p -l 2 -s 510 boot.bin)" = "55aa"

    - name: verify kernel size
      run: |
        size=$(wc -c < kernel.bin)
        echo "kernel.bin: $size bytes (limit 16384)"
        test "$size" -le 16384

    - name: verify disk image size
      run: |
        size=$(wc -c < lesos.img)
        echo "lesos.img: $size bytes (expected 1474560)"
        test "$size" -eq 1474560
